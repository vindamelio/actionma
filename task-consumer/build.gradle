
buildscript {

def envProps = new Properties()
file("${rootDir}/.env").with { f ->
    if (f.exists()) {
        f.withInputStream { envProps.load(it) }
    }
}

def use = envProps.getProperty('GITHUB_ACTOR') ?: System.getenv('GITHUB_ACTOR')
def psw = envProps.getProperty('GITHUB_TOKEN') ?: System.getenv('GITHUB_TOKEN')

def runNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "0"
def gitTag = System.getenv("GITHUB_REF_TYPE") == "tag" ? System.getenv("GITHUB_REF_NAME") : null
def gitSha = System.getenv("GITHUB_SHA")?.take(7) ?: "local"
def gitVer = project.findProperty("gpr.version") ?: "0.0.0"
def gitRel = project.findProperty("gpr.release") ?: null

def resolvedVersion = gitRel != null
    ? "${gitVer}"
    : "${gitVer}-SNAPSHOT-${gitSha}"

println("task-consumer pinco: gitVer=${gitVer} gitRel=${gitRel} gitSha=${gitSha} gitTag=${gitTag} runNumber=${runNumber} version=${resolvedVersion}")


    repositories {
        if (runNumber != "0") {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/vindamelio/actionma")
                credentials {
                    username = use
                    password = psw
                }
            }
        } else {
            mavenLocal()
        }
    }
    dependencies {
        classpath "cmx.vincenzo:task-producer:${resolvedVersion}"
    }
}

plugins {
    id 'java'
}

def envProps = new Properties()
file("${rootDir}/.env").with { f ->
    if (f.exists()) {
        f.withInputStream { envProps.load(it) }
    }
}

def use = envProps.getProperty('GITHUB_ACTOR') ?: System.getenv('GITHUB_ACTOR')
def psw = envProps.getProperty('GITHUB_TOKEN') ?: System.getenv('GITHUB_TOKEN')

def runNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "0"
def gitTag = System.getenv("GITHUB_REF_TYPE") == "tag" ? System.getenv("GITHUB_REF_NAME") : null
def gitSha = System.getenv("GITHUB_SHA")?.take(7) ?: "local"
def gitVer = project.findProperty("gpr.version") ?: "0.0.0"
def gitRel = project.findProperty("gpr.release") ?: null

def resolvedVersion = gitRel != null
    ? "${gitVer}"
    : "${gitVer}-SNAPSHOT-${gitSha}"

println("task-consumer resolved: gitVer=${gitVer} gitRel=${gitRel} gitSha=${gitSha} gitTag=${gitTag} runNumber=${runNumber} version=${resolvedVersion}")

repositories {
    mavenCentral()
    if (runNumber != "0") {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/vindamelio/actionma")
            credentials {
                username = use
                password = psw
            }
        }
    } else {
        mavenLocal()
    }
}

dependencies {
    implementation "cmx.vincenzo:task-producer:${resolvedVersion}"
    testImplementation "cmx.vincenzo:task-producer:${resolvedVersion}"

    testImplementation gradleApi()
    testImplementation gradleTestKit()

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('greet', cmx.vincenzo.GreetingTaska) {
    message.set('Ciao dal sottoprogetto consumer!')
}

tasks.register('testGreetingTask', Test) {
    description = 'Esegue solo i test relativi a GreetingTaska'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()
    filter {
        includeTestsMatching "cmx.vincenzo.GreetingTaskaTest"
    }
}



sourceSets {
    functionalTest {
        java {
            srcDir 'src/functionalTest/java'
        }
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    functionalTestImplementation.extendsFrom testImplementation
    functionalTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('functionalTest', Test) {
    description = 'Esegue i test funzionali (build reali, richiedono rete/credenziali)'
    group = 'verification'

    testClassesDirs = sourceSets.functionalTest.output.classesDirs
    classpath = sourceSets.functionalTest.runtimeClasspath

    useJUnitPlatform()

    jvmArgs(
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    )
}


test {
    useJUnitPlatform()

    jvmArgs(
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    )
}