def envProps = new Properties()
file("${rootDir}/.env").with { file ->
    if (file.exists()) {
        file.withInputStream { envProps.load(it) }
    }
}

def use = envProps.getProperty('GITHUB_ACTOR') ?: System.getenv('GITHUB_ACTOR')
def psw = envProps.getProperty('GITHUB_TOKEN') ?: System.getenv('GITHUB_TOKEN')

def runNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "0"
def gitTag = System.getenv("GITHUB_REF_TYPE") == "tag" ? System.getenv("GITHUB_REF_NAME") : null
def gitSha = System.getenv("GITHUB_SHA")?.take(7) ?: "local"
def gitVer = project.findProperty("gpr.version") ?: "0.0.0"
def gitRel = project.findProperty("gpr.release") ?: null


version = gitRel != null
    ? "${gitVer}"                              
    : "${gitVer}-SNAPSHOT-${gitSha}" 


println("task-producer gradle.properties: gitVer=${gitVer} ${gitRel} ${gitSha} ${gitTag} ${use} ${psw} ${version}")


buildscript {

    repositories {

       //mavenCentral()
       if (runNumber != "0") {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/vindamelio/actionma")
                credentials {
                    username = use
                    password = psw
                }
            }
        }else{
            mavenLocal()
        }
    }
    dependencies {
        classpath "cmx.vincenzo:task-producer:${version}"
        
    }
}


plugins {
    id 'java'
}
    def envProps = new Properties()
    file("${rootDir}/.env").with { file ->
        if (file.exists()) {
            file.withInputStream { envProps.load(it) }
        }
    }



repositories {
    mavenCentral()
    if (runNumber != "0") {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/vindamelio/actionma")
                credentials {
                    username = use
                    password = psw
                }
            }
    }else{
            mavenLocal()
    }
}


dependencies {
    // Serve al codice di test per compilare contro GreetingTask
    //testImplementation 'cmx.vincenzo:task-producer:1.0.1'
    //testImplementation "cmx.vincenzo:task-producer:${version}"
    //implementation project(':task-producer')
    //testImplementation project(':task-producer')

    implementation "cmx.vincenzo:task-producer:${version}"
    testImplementation "cmx.vincenzo:task-producer:${version}"

    testImplementation gradleApi()
    testImplementation gradleTestKit()

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('greet', cmx.vincenzo.GreetingTaska) {
    message.set('Ciao dal sottoprogetto consumer!')
}
tasks.register('testGreetingTask', Test) {
    description = 'Esegue solo i test relativi a GreetingTaska'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()
    filter {
        includeTestsMatching "cmx.vincenzo.GreetingTaskaTest"
    }
}

test {
    useJUnitPlatform()

    jvmArgs(
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    )
}


